
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#142B4A">
    <meta name="description" content="Students Companion — Your Partner in Learning. An interactive Integrated Science quiz.">

    <title>Diversity of Matter | Students Companion</title>

    <link rel="stylesheet" href="mystyle.css">
</head>
<body>
    <main class="quizContainer" aria-live="polite">
        <div class="question"></div>

        <ul class="choiceList"></ul>

        <div class="quizMessage" role="status"></div>

        <div class="result"></div>

        <div class="navigationButtons">
            <button type="button" class="previousButton" disabled>
                Previous
            </button>

            <button type="button" class="nextButton">
                Next Question
            </button>
        </div>
    </main>

    <!-- Load the quiz configuration and question bank first. -->
    <script src="quiz_questions.js"></script>

    <!-- Load access records before the authentication system. -->
    <script src="quiz_access.js"></script>

    <!-- Load authentication before the quiz engine. -->
    <script src="quiz_auth.js"></script>

    <!-- Start the quiz engine after all dependencies are ready. -->
    <script src="quiz_engine.js"></script>
</body>
</html>
